<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toppershelf Ludo Rush</title>
<style>
:root{--R:#ff3860;--G:#1fe08f;--Y:#ffc928;--B:#2f9bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0,#13409e,#0a2468 45%,#041240);display:flex;justify-content:center;overflow-x:hidden;position:relative}
.dec{position:fixed;width:90px;height:90px;border-radius:22px;background:#ffffff0d;border:2px solid #ffffff10;pointer-events:none}
.app{position:relative;width:min(100%,520px);padding:10px 12px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.hd{display:flex;align-items:center;gap:8px;width:100%}
.rb{width:40px;height:40px;border-radius:50%;border:2px solid #2d56c2;background:linear-gradient(#0e2a78,#071a52);display:grid;place-items:center;flex:none;cursor:pointer}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo{width:36px;height:36px;flex:none}.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand>div:last-child{min-width:0}.brand b,.brand small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand b{font-size:17px;line-height:1.1}.brand small{font-size:12px;opacity:.8;line-height:1.2}
.ib{width:38px;height:38px;border:0;padding:0;background:none;cursor:pointer;flex:none}.ib img{width:100%;height:100%}
.ban{width:78%;text-align:center;padding:8px 10px;border-radius:20px;border:2px solid #2d56c2;background:linear-gradient(#0e2a78cc,#071a52cc);box-shadow:0 0 18px #2d7bff55}
.ban div{font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center;justify-content:center}.ban img{height:24px}
.ban small{display:block;font-size:12px;opacity:.9;min-height:15px}
.pr{display:flex;justify-content:space-between;gap:10px;width:100%}
.pl{position:relative;flex:1;min-width:0;height:50px;padding:0 10px 0 62px;border:2px solid var(--k);border-radius:999px;background:linear-gradient(#0b1b4d,#050d2c);display:flex;flex-direction:column;justify-content:center;transition:.25s;opacity:.88}
.pl.rt{padding:0 62px 0 12px}
.av{position:absolute;left:-6px;top:50%;translate:0 -50%;width:58px;height:58px;border-radius:50%;border:3px solid var(--k);box-shadow:0 0 12px var(--k);overflow:hidden;background:#0a1a4a}
.rt .av{left:auto;right:-6px}.av img{width:100%;height:100%;display:block}
.nm{font-weight:800;font-size:15px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:5px;margin-top:4px}.dots i{width:13px;height:13px;border-radius:50%;border:2px solid #8da2d8;transition:.3s}.dots i.f{background:var(--k);border-color:#fff;box-shadow:0 0 8px var(--k)}
.pl.on{opacity:1;box-shadow:0 0 22px var(--k),inset 0 0 14px #ffffff22;animation:pg 1s ease-in-out infinite alternate}
@keyframes pg{to{box-shadow:0 0 34px var(--k),inset 0 0 18px #ffffff33}}
.bw{width:min(100%,max(280px,calc(100dvh - 400px)))}
.board{position:relative;width:100%;aspect-ratio:1/1;filter:drop-shadow(0 18px 20px #0009)}
.board>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.tk{position:absolute;width:5.7%;translate:-50% -80%;pointer-events:none;transition:left .17s ease-in-out,top .17s ease-in-out,scale .2s;transform-origin:50% 100%}
.tk img{display:block;width:100%;transform-origin:50% 100%}
.tk.sm{scale:.72}
.tk.can{pointer-events:auto;cursor:pointer}
.tk.can::before{content:"";position:absolute;left:-22%;right:-22%;bottom:-6%;height:34%;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px #fff;animation:pulse .7s ease-in-out infinite alternate}
.tk.can::after{content:"";position:absolute;inset:-20% -35%}
@keyframes pulse{to{scale:1.2;opacity:.45}}
.ctl{display:flex;align-items:center;justify-content:center;width:100%;gap:18px;margin-top:2px}.ctl .bt{width:min(46%,170px)}
.bt{border:0;padding:0;background:none;width:100%;max-width:170px;justify-self:center;cursor:pointer;transition:.2s;border-radius:999px}.bt img{width:100%;display:block}
.bt:disabled{filter:grayscale(.7) brightness(.7);cursor:default}.bt.on{filter:drop-shadow(0 0 10px #38e1ff) brightness(1.15)}
.ring{width:104px;height:104px;border-radius:50%;border:4px solid #3aa8ff;background:radial-gradient(circle,#1b4fc4,#0a2468 70%);box-shadow:0 0 26px #3aa8ff,inset 0 0 18px #0008;display:grid;place-items:center;flex:none;cursor:pointer}
.sc{width:60px;height:60px;perspective:420px}
.dice{width:50px;height:50px;margin:5px;position:relative;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.2,.8,.2,1);transform:rotateX(0deg) rotateY(0deg)}
.dice.go{animation:toss 1.2s cubic-bezier(.2,.7,.3,1)}
@keyframes toss{0%{translate:0 0}30%{translate:0 -34px}60%{translate:0 0}75%{translate:0 -10px}100%{translate:0 0}}
.f{position:absolute;inset:0;border-radius:11px;background:linear-gradient(145deg,#fff,#c3cdf5);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;box-shadow:inset 0 0 8px #3a52b788;backface-visibility:hidden;border:1.5px solid #2a3f9a}
.f b{width:8px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2a4bb8,#06165a);place-self:center}
.f1{transform:translateZ(25px)}.f6{transform:rotateY(180deg) translateZ(25px)}.f2{transform:rotateY(90deg) translateZ(25px)}.f5{transform:rotateY(-90deg) translateZ(25px)}.f3{transform:rotateX(90deg) translateZ(25px)}.f4{transform:rotateX(-90deg) translateZ(25px)}
.conf{position:fixed;width:9px;height:14px;top:-20px;pointer-events:none;z-index:99;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#ov{position:fixed;inset:0;display:none;place-items:center;background:#020a2acc;z-index:100;text-align:center}#ov.show{display:grid}
#ov img.tr{height:120px;filter:drop-shadow(0 0 24px #ffc928);animation:pop .8s ease-out}
@keyframes pop{from{scale:.2;opacity:0}}
#ov h2{font-size:clamp(28px,8vw,44px);margin:8px 0 14px}#ov .bt{width:200px;max-width:70vw}

/* small phones: slimmer cards so nothing touches */
@media (max-width:359px){.app{padding:8px 8px 14px;gap:8px}.pl{height:46px;padding-left:52px}.pl.rt{padding-right:52px}.av{width:50px;height:50px}.nm{font-size:13px}.dots i{width:11px;height:11px}.ring{width:92px;height:92px}.ban div{font-size:18px}}
/* tablets held upright: bigger column, same stack */
@media (min-width:700px) and (orientation:portrait){
 .app{width:min(100%,700px);padding:18px 24px 24px;gap:16px}
 .rb{width:46px;height:46px}.ib{width:44px;height:44px}.logo{width:42px;height:42px}.brand b{font-size:20px}.brand small{font-size:13px}
 .ban{width:70%}.ban div{font-size:24px}.ban img{height:28px}.ban small{font-size:14px}
 .pl{height:60px;padding-left:76px}.pl.rt{padding-right:76px;padding-left:14px}.av{width:70px;height:70px}.nm{font-size:18px}.dots i{width:15px;height:15px}
 .bw{width:min(100%,max(420px,calc(100dvh - 495px)))}
 .ring{width:124px;height:124px}.bt{max-width:210px}
}
/* wide screens (tablets on their side, laptops, desktops, phones on their side): board on the left, everything else beside it */
@media (orientation:landscape) and (min-width:760px){
 body{align-items:center}
 .app{width:min(100%,1240px);min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,36vw,420px);grid-template-rows:auto 1fr auto auto auto auto 1fr;grid-template-areas:"hd hd" "bw ." "bw ban" "bw top" "bw bot" "bw ctl" "bw .";column-gap:28px;row-gap:14px;align-content:stretch;align-items:center;justify-items:stretch;padding:12px 24px 16px}
 .hd{grid-area:hd}.ban{grid-area:ban;width:100%}#top{grid-area:top}#bot{grid-area:bot}.ctl{grid-area:ctl}
 .bw{grid-area:bw;justify-self:center;align-self:center;width:min(100%,calc(100dvh - 90px))}
 .ring{width:112px;height:112px}
}
/* phones on their side are short: tighten the side column */
@media (orientation:landscape) and (min-width:760px) and (max-height:520px){
 .app{row-gap:8px;padding:6px 16px 8px}.ban{padding:4px 8px}.ban div{font-size:17px}.ban img{height:20px}.ban small{font-size:11px;min-height:0}
 .pl{height:44px;padding-left:52px}.pl.rt{padding-right:52px;padding-left:10px}.av{width:50px;height:50px}.nm{font-size:13px}.dots{margin-top:2px}
 .ring{width:88px;height:88px}.bw{width:min(100%,calc(100dvh - 64px))}.rb{width:34px;height:34px}.ib{width:34px;height:34px}.logo{width:30px;height:30px}
}

#su{position:fixed;inset:0;z-index:50;overflow:auto;display:none;background:radial-gradient(ellipse at 50% 0,#13409e,#0a2468 45%,#041240);padding:max(14px,env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom,0px));color:#fff}
#su.show{display:block}
#su .w{width:min(100%,520px);margin:0 auto;display:flex;flex-direction:column;gap:14px}
#su h2{margin:0;font-size:24px}#su p{margin:0;color:#a9bbea;font-size:13.5px;line-height:1.45}
#su .mc{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:22px;border:2px solid #2d56c2;background:linear-gradient(#0e2a78cc,#071a52cc);color:#fff;font:inherit;cursor:pointer}
#su .mc b{display:block;font-size:18px;margin-bottom:3px}#su .mc span{font-size:13px;color:#a9bbea;line-height:1.4}
#su .mc img{height:40px;margin-right:-8px}
#su .mc img.ic{height:60px;width:60px;margin-right:0;flex:none;border-radius:50%;box-shadow:0 0 16px #38e1ff66}
.sb{min-height:54px;border:0;border-radius:18px;padding:12px;font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(#27e8a0,#12b673);box-shadow:0 5px 0 #0a7a4e}
.sb:disabled{opacity:.45;cursor:default}.sb.ghost{background:none;box-shadow:none;border:2px solid #2d56c2;min-height:46px;font-size:14px;margin-top:10px}
#su .bk{align-self:flex-start;border:0;background:none;color:#a9bbea;font:inherit;font-weight:700;cursor:pointer;min-height:40px;padding:6px 2px}
#su .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#su .sg button{min-height:46px;border-radius:14px;border:2px solid #2d56c2;background:none;color:#fff;font:inherit;font-weight:800;cursor:pointer}#su .sg button.on{background:#2d56c2}
#su .cp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#su .cp button{aspect-ratio:1;max-width:76px;width:100%;justify-self:center;border-radius:50%;border:3px solid var(--k);padding:0;overflow:hidden;background:#0a1a4a;cursor:pointer;opacity:.55}#su .cp button.on{opacity:1;box-shadow:0 0 16px var(--k)}#su .cp img{width:100%;height:100%;display:block}
#su .sd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#su .st{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:22px;border:3px solid var(--k);background:linear-gradient(#0b1b4d,#050d2c)}
#su .st.off{border-style:dashed;opacity:.6}#su .st.off .a{filter:grayscale(.9) brightness(.65);box-shadow:none}
#su .st .h{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;border-radius:14px}
#su .a{width:64px;height:64px;border-radius:50%;border:3px solid var(--k);overflow:hidden;background:#0a1a4a;box-shadow:0 0 12px var(--k)}#su .a img{width:100%;height:100%;display:block}
#su .t{height:40px;margin-top:-6px;filter:drop-shadow(0 4px 4px #0008)}#su .st.off .t{opacity:.4}
#su .sm{font-size:12px;color:#a9bbea}
#su input{width:100%;padding:8px;border-radius:10px;border:2px solid #ffffff30;background:#00000040;color:#fff;font:inherit;font-size:15px;text-align:center;outline:none}
#su button:focus-visible,#su input:focus-visible{outline:3px solid #38e1ff;outline-offset:2px}

/* pass and play: every player has their own dice in their own corner, so nobody has to turn the phone */
body.pp .ctl{display:none}
.av.ds{overflow:visible;background:none;border:0;box-shadow:none;--ds:.56}
.av.ds>img{width:100%;height:100%;object-fit:contain;padding:9px;border-radius:50%;border:3px solid var(--k);background:#0a1a4a;box-shadow:0 0 12px var(--k);opacity:.6;display:block}
.av.ds.live>img{display:none}
.av.ds .ring{position:absolute;left:50%;top:50%;width:104px;height:104px;transform:translate(-50%,-50%) scale(var(--ds));transform-origin:center;border-color:var(--k);box-shadow:0 0 26px var(--k),inset 0 0 18px #0008}
.av.pc img{object-fit:contain;padding:7px;background:#0a1a4a}
@media (max-width:359px){.av.ds{--ds:.48}}
@media (min-width:700px) and (orientation:portrait){.av.ds{--ds:.67}}
@media (orientation:landscape) and (min-width:760px) and (max-height:520px){.av.ds{--ds:.48}}
/* setup screens: people get their colour piece, computers keep the robot */
#su .a.pc img{object-fit:contain;padding:8px}#su .cp img{object-fit:contain;padding:9px}
</style></head><body>

/* ---- online: the room's host keeps the real game. This page only draws what it is sent and asks for rolls and moves. ---- */
function toParent(m){try{window.parent.postMessage(m,location.origin)}catch(e){}}
var OQ=[],OB=false,OV=-1,OC=null,OTO=0;
function onlineFailsafe(){clearTimeout(OTO);OTO=setTimeout(function(){if(!OB&&OC&&(phase==='rolling'||phase==='anim'))applyUi(OC,false)},3500)}
function onlineRoll(){if(phase!=='roll'||OB)return;phase='rolling';sync();toParent({type:'ludo:roll'});onlineFailsafe()}
function onlineMove(i){if(phase!=='pick'||OB)return;phase='anim';mark();toParent({type:'ludo:move',i:i});onlineFailsafe()}
function snap(g){g.players.forEach(function(p){if(T[p.color])T[p.color]=p.tokens.slice()})}
function applyUi(g,bonus){
 var cp=g.players[g.turn];if(cp)turn=Math.max(0,CO.indexOf(cp.color));
 over=g.phase==='done';val=g.die;movable=g.movable.slice();phase=over?'over':g.step==='pick'?'pick':'roll';
 mark();render();sync();if(over)return;
 var k=CO[turn];
 if(g.step==='pick')say(me(k)?'Tap a glowing token to move it':NM[k]+' is choosing…');else turnMsg(!!bonus)}
function spinTo(c,v,cb){
 dice.classList.remove('go');void dice.offsetWidth;dice.classList.add('go');spinX+=720;spinY+=1080;
 dice.style.transform='rotateX('+(rot[v][0]+spinX)+'deg) rotateY('+(rot[v][1]+spinY)+'deg)';diceSfx(v);
 say((me(c)?'You roll':NM[c]+' rolls')+'…');
 setTimeout(function(){if(v===6){confetti();if(navigator.vibrate)navigator.vibrate(50)}say(wn(c)+' rolled a '+v+'!');cb()},1250)}
function onlineWin(c){
 win(c);$('ovb').style.display=HOST?'':'none';$('ovc').textContent='Leave room';$('ovc').onclick=function(){toParent({type:'ludo:leave'})};
 if(!HOST&&!$('ovw')){var w=document.createElement('p');w.id='ovw';w.style.cssText='margin:0 0 14px;color:#a9bbea;font-size:14px';w.textContent='Waiting for the host to start a new game…';$('ovt').after(w)}}
function playState(g,done){
 var P=OC;OC=g;var l=g.last;
 if(!P||!l){snap(g);applyUi(g,false);if(g.phase==='done'&&l)onlineWin(l.color);return done()}
 phase='anim';mark();sync();
 if(l.kind==='roll'){return spinTo(l.color,l.value,function(){applyUi(g,false);setTimeout(done,250)})}
 if(l.kind==='nomove'||l.kind==='lost'){return spinTo(l.color,l.value,function(){
  if(l.kind==='lost'){say('Three 6s in a row! Turn lost.');tone(200,'sawtooth',.4,.2,0,60)}else say('No move possible.');
  setTimeout(function(){snap(g);applyUi(g,l.kind==='nomove'&&l.value===6);done()},l.kind==='lost'?1100:900)})}
 var c=l.color,po=P.players.filter(function(p){return p.color===c})[0],pn=g.players.filter(function(p){return p.color===c})[0],idx=-1;
 if(po&&pn)for(var i=0;i<4;i++)if(po.tokens[i]!==pn.tokens[i])idx=i;
 if(idx<0){snap(g);applyUi(g,false);if(g.phase==='done')onlineWin(c);return done()}
 var p0=po.tokens[idx],p1=pn.tokens[idx],tg=[];
 if(p0<0){tg=[p1];tone(300,'sine',.3,.25,0,900)}else for(var j=p0+1;j<=p1;j++)tg.push(j);
 var fin=function(){
  var cap=false;
  g.players.forEach(function(p){if(p.color===c)return;var o=P.players.filter(function(q){return q.color===p.color})[0];
   p.tokens.forEach(function(q,j){if(o&&o.tokens[j]>=0&&q<0){T[p.color][j]=-1;cap=true}})});
  var home=p1===56;
  if(cap){boom(TR[(START[c]+p1)%52]);killSfx();say(wn(c)+' captured a token!')}
  if(home){chime();say(wn(c)+' got a token home!')}
  snap(g);render();
  if(g.phase==='done'){onlineWin(c);return done()}
  setTimeout(function(){applyUi(g,g.turn===P.turn);done()},cap||home?900:450)};
 (function st(n){if(n>=tg.length)return fin();T[c][idx]=tg[n];render();hop(els[c][idx]);tone(520+n*25,'sine',.09,.18);setTimeout(function(){st(n+1)},175)})(0)}
function pump(){if(OB||!OQ.length)return;OB=true;playState(OQ.shift(),function(){OB=false;pump()})}
function startOnline(){
 T={};CO.forEach(function(k){T[k]=[-1,-1,-1,-1]});turn=0;phase='anim';sixes=0;over=false;movable=[];$('ov').classList.remove('show');
 render();mark();say('Connecting…');sync();
 window.addEventListener('message',function(e){
  if(e.origin!==location.origin||e.source!==window.parent)return;
  var d=e.data;if(!d||d.type!=='ludo:state'||!d.game||d.game.v<=OV)return;
  OV=d.game.v;OQ.push(d.game);pump()});
 toParent({type:'ludo:ready'})}
window.__ludo={get T(){return T},get over(){return over}};
if(ON)startOnline();else reset();

/* Choose how to play: vs computers, or pass and play with names. Starting reloads the page with ?p= so the game uses exactly those players. */
(function(){
var su=$('su'),HX=HEX,NMC={R:'Red',G:'Green',Y:'Yellow',B:'Blue'},CW=['R','G','Y','B'],GRID=['R','G','B','Y'];
var S={v:'home',me:'R',n:1,on:{R:1,Y:1},nm:{}};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pre(me,n){var i=CW.indexOf(me),l=[CW[(i+2)%4],CW[(i+1)%4],CW[(i+3)%4]].slice(0,n),o={};l.forEach(function(k){o[k]=1});return o}
function go(list){location.href=location.pathname+'?p='+list.join(',')}
function seat(k,cls,who,sub,extra,act,bot){return '<div class="st '+cls+'" style="--k:'+HX[k]+'"><button class="h" data-a="'+act+'" data-k="'+k+'" aria-label="'+NMC[k]+'"><div class="a'+(bot?'':' pc')+'"><img src="'+(bot?AV[k]:TKI[k])+'" alt=""></div><b>'+who+'</b><span class="sm">'+sub+'</span></button>'+(extra||'')+'</div>'}
var GLOBE='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><radialGradient id="o" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7fd4ff"/><stop offset=".45" stop-color="#2f9bff"/><stop offset="1" stop-color="#0b3aa8"/></radialGradient><radialGradient id="h" cx=".32" cy=".22" r=".4"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="c"><circle cx="60" cy="60" r="52"/></clipPath></defs><circle cx="60" cy="60" r="56" fill="#0a1a4a"/><circle cx="60" cy="60" r="52" fill="url(#o)"/><g clip-path="url(#c)"><path d="M22 38c6-8 16-12 24-10 4 3 2 8-2 10-5 2-6 8-12 9-5 1-9-3-10-9z" fill="#2fe08f"/><path d="M52 62c6-3 14-2 17 3 3 6 1 14-4 20-3 4-8 4-10 0-2-6-6-9-5-15 0-4 0-6 2-8z" fill="#2fe08f"/><path d="M70 32c8-5 20-4 28 2 4 4 2 9-3 10-6 1-8 6-14 5-6-1-9-7-14-8-3-3-3-7 3-9z" fill="#2fe08f"/><path d="M84 66c6-1 12 2 12 7s-5 9-10 8c-5-2-7-8-2-15z" fill="#2fe08f"/><g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.6"><ellipse cx="60" cy="60" rx="22" ry="52"/><ellipse cx="60" cy="60" rx="42" ry="52"/><path d="M8 60h104M14 36h92M14 84h92"/></g></g><circle cx="60" cy="60" r="52" fill="url(#h)"/><circle cx="60" cy="60" r="52" fill="none" stroke="#9fe3ff" stroke-width="3" stroke-opacity=".8"/><circle cx="96" cy="26" r="9" fill="#1fe08f" stroke="#fff" stroke-width="3"/></svg>');
function home(){return '<div class="w"><h2>Choose how to play</h2><p>Pick a mode to start a new game.</p>'+
 '<button class="mc" data-m="vc"><img class="ic" src="'+AV.G+'" alt=""><div><b>Vs computer</b><span>Play against 1, 2 or 3 computers.</span></div></button>'+
 '<button class="mc" data-m="pp"><img src="'+TKI.R+'" alt=""><img src="'+TKI.G+'" alt=""><img src="'+TKI.Y+'" alt=""><div><b>Pass and play</b><span>2, 3 or 4 people on one device, each with their own name. No computers.</span></div></button>'+
 (window.parent!==window?'<button class="mc" data-ol="1"><img class="ic" src="'+GLOBE+'" alt=""><div><b>Play online</b><span>Make a room and share the code, or join a friend\'s room. 2 to 4 players on their own phones.</span></div></button>':'')+'</div>'}
function vcv(){var bs=pre(S.me,S.n);
 return '<div class="w"><button class="bk" data-m="home">‹ Back</button><h2>Vs computer</h2><p>Pick your colour and how many computers you play against.</p>'+
 '<div class="cp">'+GRID.map(function(k){return '<button data-me="'+k+'" style="--k:'+HX[k]+'" class="'+(S.me===k?'on':'')+'" aria-label="'+NMC[k]+'"><img src="'+TKI[k]+'" alt=""></button>'}).join('')+'</div>'+
 '<div class="sg">'+[1,2,3].map(function(c){return '<button data-n="'+c+'" class="'+(S.n===c?'on':'')+'">'+c+(c>1?' computers':' computer')+'</button>'}).join('')+'</div>'+
 '<div class="sd">'+GRID.map(function(k){var m=S.me===k,b=bs[k];return seat(k,m||b?'':'off',m?'You':b?'Computer':NMC[k],m||b?NMC[k]:'Not playing','','x',!m&&b)}).join('')+'</div>'+
 '<button class="sb" id="go">Play vs '+S.n+(S.n>1?' computers':' computer')+'</button></div>'}
function ppv(){var c=CW.filter(function(k){return S.on[k]}).length;
 return '<div class="w"><button class="bk" data-m="home">‹ Back</button><h2>Pass and play</h2><p>Switch on the colours that play and type each player’s name. Colours left off are not in the game.</p>'+
 '<div class="sg">'+[2,3,4].map(function(n){return '<button data-pc="'+n+'" class="'+(n===c?'on':'')+'">'+n+' players</button>'}).join('')+'</div>'+
 '<div class="sd">'+GRID.map(function(k){var o=S.on[k];return seat(k,o?'':'off',o?esc(S.nm[k]||NMC[k]):NMC[k],o?'Tap to remove':'Tap to add',o?'<input data-n2="'+k+'" maxlength="16" placeholder="Name" aria-label="Name for '+NMC[k]+'">':'','pp')}).join('')+'</div>'+
 '<button class="sb" id="go"'+(c>=2?'':' disabled')+'>Start game</button></div>'}
function draw(){su.innerHTML=S.v==='home'?home():S.v==='vc'?vcv():ppv();
 su.querySelectorAll('[data-n2]').forEach(function(i){i.value=S.nm[i.dataset.n2]||'';i.oninput=function(){S.nm[i.dataset.n2]=i.value}});
 su.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){S.v=b.dataset.m;draw()}});
 su.querySelectorAll('[data-ol]').forEach(function(b){b.onclick=function(){try{window.parent.postMessage({type:'ludo:online'},location.origin)}catch(e){}}});
 su.querySelectorAll('[data-me]').forEach(function(b){b.onclick=function(){S.me=b.dataset.me;draw()}});
 su.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){S.n=+b.dataset.n;draw()}});
 su.querySelectorAll('[data-pc]').forEach(function(b){b.onclick=function(){var pc=+b.dataset.pc,l={2:['R','Y'],3:['R','G','Y'],4:CW}[pc];S.on={};l.forEach(function(k){S.on[k]=1});draw()}});
 su.querySelectorAll('[data-a="pp"]').forEach(function(b){b.onclick=function(){var k=b.dataset.k;if(S.on[k]){if(CW.filter(function(c){return S.on[c]}).length<=2)return;delete S.on[k]}else S.on[k]=1;draw()}});
 var g=$('go');if(g)g.onclick=function(){
  if(S.v==='vc'){var bs=pre(S.me,S.n);go(CW.filter(function(k){return k===S.me||bs[k]}).map(function(k){return k===S.me?k+':You:h':k+'::b'}))}
  else go(CW.filter(function(k){return S.on[k]}).map(function(k){return k+':'+encodeURIComponent((S.nm[k]||'').trim())+':h'}))}}
$('ovc').onclick=function(){location.href=location.pathname};
/* Tell the page around us how tall the setup screen is, so the frame fits it instead of leaving empty space. */
function report(){if(window.parent===window)return;var w=su.querySelector('.w'),h=0;if(!CFG&&w)h=Math.ceil(w.getBoundingClientRect().height)+38;try{window.parent.postMessage({type:'ludo:size',mode:CFG?'game':'setup',h:h},location.origin)}catch(e){}}
var _draw=draw;draw=function(){_draw();report()};
window.addEventListener('resize',report);
if(!CFG){su.classList.add('show');draw()}
report();setTimeout(report,300)
})();
})();
</script></body></html>
